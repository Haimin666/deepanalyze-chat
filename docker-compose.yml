version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: deepanalyze-backend
    ports:
      - "8200:8200"
      - "8100:8100"
    volumes:
      - ./data/db:/app/deepanalyze.db    # 持久化 SQLite 数据库
      - ./data/workspace:/app/workspace  # 持久化用户工作区文件
    restart: always
    # 如果你的机器有 GPU 并需要直接调用本地的大模型推理，取消下面注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: deepanalyze-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always