# ============================================
# DeepAnalyze - Docker Compose Configuration
# ============================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: deepanalyze-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: deepanalyze
      MYSQL_USER: deepanalyze
      MYSQL_PASSWORD: ${DB_PASSWORD:-deepanalyze123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "3306:3306"
    networks:
      - deepanalyze-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8200}
        NEXT_PUBLIC_FILE_SERVER_URL: ${NEXT_PUBLIC_FILE_SERVER_URL:-http://localhost:8100}
        NEXT_PUBLIC_SESSION_TIMEOUT_MINUTES: ${NEXT_PUBLIC_SESSION_TIMEOUT_MINUTES:-10}
    container_name: deepanalyze-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: deepanalyze
      DB_PASSWORD: ${DB_PASSWORD:-deepanalyze123}
      DB_NAME: deepanalyze
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_production_jwt_secret_key_change_me}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8200
      # File Server
      HTTP_SERVER_PORT: 8100
      HTTP_SERVER_BASE: ${HTTP_SERVER_BASE:-http://localhost:8100}
      # Workspace
      WORKSPACE_BASE_DIR: /app/workspace
      # AI/LLM
      API_BASE: ${API_BASE:-http://localhost:8000/v1}
      MODEL_PATH: ${MODEL_PATH:-DeepAnalyze-8B}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      # Session
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-10}
    volumes:
      - workspace_data:/app/workspace
    ports:
      - "3000:3000"
      - "8100:8100"
      - "8200:8200"
    networks:
      - deepanalyze-network

volumes:
  mysql_data:
    driver: local
  workspace_data:
    driver: local

networks:
  deepanalyze-network:
    driver: bridge
